name: tsuzuki_connect
description: "A visual novel language learning adventure."
publish_to: 'none' # Prevents accidental publishing to pub.dev

# Version follows semantic versioning (major.minor.patch+build)
version: 2.0.0+8
ios_version: 3.0.0+9
macos_version: 3.0.0+13

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Immutable models / JSON
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Persistence (settings, progress, save slots)
  shared_preferences: ^2.3.3

  # Text-to-speech (wraps native AVSpeechSynthesizer on iOS/macOS, TTS engine on Android)
  flutter_tts: ^4.2.0

  # Looping scene music from the bundled assets/audio tracks
  audioplayers: ^6.7.1

  # In-app purchases (StoreKit2 on iOS, Play Billing on Android)
  in_app_purchase: ^3.2.1

  # Localization
  intl: ^0.19.0

  # Path helpers for loading bundled JSON content
  path: ^1.9.0

  # Google Fonts (Fredoka / Zen Maru Gothic) without manual asset bundling
  google_fonts: ^6.2.1

  # Scene background video playback (js/graphics/backgrounds/BackgroundAssets.js)
  video_player: ^2.9.5

  # Opening external credit links (credits_screen.dart)
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  in_app_review: ^2.0.12
  # synthkit: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/translations/
    - assets/vocabulary/
    - assets/backgrounds/
    - assets/characters/
    - assets/audio/
