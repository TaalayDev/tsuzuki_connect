        stroke="#3E2723"
        stroke-opacity="0.22"
        stroke-width="3"
      />
      <g transform="rotate(72 400 400)">
        <path
          d="M400 195C363 211 335 245 347 287C361 337 400 379 400 379C400 379 439 337 453 287C465 245 437 211 400 195Z"
          fill="url(#petalGrad)"
          stroke="#3E2723"
          stroke-opacity="0.22"
          stroke-width="3"
        />
      </g>
      <g transform="rotate(144 400 400)">
        <path
          d="M400 195C363 211 335 245 347 287C361 337 400 379 400 379C400 379 439 337 453 287C465 245 437 211 400 195Z"
          fill="url(#petalGrad)"
          stroke="#3E2723"
          stroke-opacity="0.22"
          stroke-width="3"
        />
      </g>
      <g transform="rotate(216 400 400)">
        <path
          d="M400 195C363 211 335 245 347 287C361 337 400 379 400 379C400 379 439 337 453 287C465 245 437 211 400 195Z"
          fill="url(#petalGrad)"
          stroke="#3E2723"
          stroke-opacity="0.22"
          stroke-width="3"
        />
      </g>
      <g transform="rotate(288 400 400)">
        <path
          d="M400 195C363 211 335 245 347 287C361 337 400 379 400 379C400 379 439 337 453 287C465 245 437 211 400 195Z"
          fill="url(#petalGrad)"
          stroke="#3E2723"
          stroke-opacity="0.22"
          stroke-width="3"
        />
      </g>
    </g>

    <circle cx="400" cy="400" r="54" fill="#FDF8F9" stroke="#3E2723" stroke-opacity="0.28" stroke-width="4"/>
    <circle cx="400" cy="400" r="18" fill="#3E2723" fill-opacity="0.78"/>
    <circle cx="376" cy="384" r="6" fill="#3E2723" fill-opacity="0.55"/>
    <circle cx="426" cy="382" r="6" fill="#3E2723" fill-opacity="0.55"/>
    <circle cx="400" cy="430" r="6" fill="#3E2723" fill-opacity="0.55"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(760, 0)">
    <text
