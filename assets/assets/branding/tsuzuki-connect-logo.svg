<?xml version="1.0" encoding="UTF-8"?>
<svg width="2400" height="800" viewBox="0 0 2400 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tsuzuki Connect logo">
  <defs>
    <linearGradient id="petalGrad" x1="320" y1="190" x2="520" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB7C5"/>
      <stop offset="0.55" stop-color="#FF91A4"/>
      <stop offset="1" stop-color="#E57373"/>
    </linearGradient>
    <linearGradient id="loopGrad" x1="180" y1="400" x2="580" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#98D8C8"/>
      <stop offset="1" stop-color="#FF91A4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#3E2723" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Mark -->
  <g transform="translate(0,0)" filter="url(#softShadow)">
    <path
