      <stop offset="1" stop-color="#FF91A4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3E2723" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Infinity / connection loop -->
