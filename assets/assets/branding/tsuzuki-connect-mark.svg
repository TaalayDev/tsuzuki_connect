<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tsuzuki Connect mark">
  <defs>
    <linearGradient id="petalGrad" x1="200" y1="160" x2="312" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB7C5"/>
      <stop offset="0.55" stop-color="#FF91A4"/>
      <stop offset="1" stop-color="#E57373"/>
    </linearGradient>
    <linearGradient id="loopGrad" x1="128" y1="256" x2="384" y2="256" gradientUnits="userSpaceOnUse">
